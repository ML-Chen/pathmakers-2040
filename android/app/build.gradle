plugins { id 'com.android.application' }

// Release signing comes from environment variables set by CI from GitHub secrets (see docs/ANDROID.md).
// Without them the release build is signed with the debug key, which installs fine but cannot update an
// app signed with a different key.
def ks = System.getenv("PM_KEYSTORE_FILE")

android {
    namespace 'org.pathmakers.game'
    compileSdk 34
    defaultConfig {
        applicationId "org.pathmakers.game"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("PM_VERSION_CODE") ?: "1") as int)
        versionName System.getenv("PM_VERSION_NAME") ?: "0.1"
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("PM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PM_KEY_ALIAS")
                keyPassword System.getenv("PM_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // The game page is ~9 MB of HTML with inlined audio; keep it uncompressed so the WebView reads it quickly.
    androidResources { noCompress 'html' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
