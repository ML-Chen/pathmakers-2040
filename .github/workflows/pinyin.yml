name: Make pinyin
# Regenerates src/i18n/zh_pinyin/*.js (the pinyin shown over Chinese text when the 拼音 switch is on) with
# tools/i18n_pinyin.js and pinyin-pro, whenever a Chinese translation file changes, and commits the result to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/i18n/zh/**', 'tools/i18n_pinyin.js']
permissions:
  contents: write
  actions: write
concurrency:
  group: pinyin
  cancel-in-progress: false
jobs:
  pinyin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pinyin
        run: |
          npm install --no-save --no-audit --no-fund pinyin-pro@3.26.0
          node tools/i18n_pinyin.js zh
      - name: Commit the pinyin
        id: commit
        run: |
          git add src/i18n/zh_pinyin/
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -qm "Make pinyin for the Chinese text"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Republish the site and the app with the new pinyin
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run android.yml --ref main
