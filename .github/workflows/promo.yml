name: RedNote promo video
# Builds the Mandarin concept video (promo/rednote): Kokoro narration, the game played live at 1080x1440 in Chinese,
# music, and subtitles. Publishes rednote.mp4, the contact sheet, every still and a narrator audition to the
# "Promo (latest)" release. Runs by hand, and whenever the promo files change on main.
on:
  workflow_dispatch:
    inputs:
      speaker: {description: 'Narrator. With the ELEVENLABS_API_KEY secret: a native Mandarin voice from the ElevenLabs library, by name (see the audition zip) or voice id; empty picks the most-used one. Without it: a Kokoro voice (zf_xiaoxiao, zm_yunjian, ...). Empty = default.', default: ''}
      speed: {description: 'Speaking speed (ElevenLabs allows 0.7 to 1.2)', default: '1.2'}
  push:
    branches: [main]
    paths: ['promo/rednote/**', 'promo/tools/zh_tts.py']
permissions:
  contents: write
concurrency:
  group: promo
  cancel-in-progress: true
env:
  PLAYWRIGHT_VERSION: 1.63.0
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install sherpa-onnx, ffmpeg, Chinese fonts, Playwright
        run: |
          pip install "sherpa-onnx==1.13.8" numpy edge-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium
      - name: Cache the Kokoro model
        id: model
        uses: actions/cache@v4
        with: {path: ../tts-models, key: kokoro-multi-lang-v1_0}
      - name: Download the Kokoro model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ../tts-models && cd ../tts-models
          curl -sSLO https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2
          tar xjf kokoro-multi-lang-v1_0.tar.bz2 && rm kokoro-multi-lang-v1_0.tar.bz2
      - name: Mandarin narration (Edge neural voice by default)
        env: {ELEVENLABS_API_KEY: '${{ secrets.ELEVENLABS_API_KEY }}', PROMO_TTS: "${{ github.event.inputs.engine || 'edge' }}"}
        run: set -o pipefail; python3 promo/rednote/vo.py vo "${{ github.event.inputs.speaker }}" "${{ github.event.inputs.speed || '1.2' }}" | tee vo.log
      - name: Background music (ElevenLabs Music when the secret is set)
        env: {ELEVENLABS_API_KEY: '${{ secrets.ELEVENLABS_API_KEY }}'}
        run: |
          secs=$(python3 -c "import json;d=json.load(open('vo/durations.json'));print(round(sum(d.values())+len(d)*1.1+6))" 2>/dev/null || echo 95)
          if python3 promo/rednote/music.py promo-music.mp3 "$secs"; then echo "PROMO_MUSIC=$PWD/promo-music.mp3" >> "$GITHUB_ENV"; fi
      - name: Build the game and render the video
        run: |
          python3 src/build.py dist/pathmakers.html
          node promo/rednote/render.js dist/pathmakers.html video vo
          node promo/rednote/cover.js video dist/pathmakers.html
      - uses: actions/upload-artifact@v4
        with:
          name: promo
          path: |
            video/rednote.mp4
            video/contact.jpg
            video/cover.png
            video/stills/
            vo/
          retention-days: 30
      - name: Publish the "Promo (latest)" release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          cd vo && zip -q ../narrator-audition.zip audition_*.wav && cd ..
          files=(video/rednote.mp4 video/cover.png video/contact.jpg narrator-audition.zip)
          NOTES="RedNote concept video from ${GITHUB_SHA::7}, $(date -u '+%b %d %H:%M UTC'). $(grep '^engine' vo.log). narrator-audition.zip has the first line in several voices; rerun this workflow with another speaker to switch."
          if gh release view promo-latest >/dev/null 2>&1; then
            for a in $(gh release view promo-latest --json assets -q '.assets[].name'); do gh release delete-asset promo-latest "$a" -y; done
            gh release upload promo-latest "${files[@]}" --clobber
            gh release edit promo-latest --notes "$NOTES"
          else
            gh release create promo-latest "${files[@]}" --title "Promo (latest)" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          fi
